# UPV DSIC HPC Cluster Configuration (tensor.dsic.upv.es)
# Hardware: 503GB RAM, 4x NVIDIA L40S 48GB GDDR6 ECC (24 logical shards total -> ~8GB VRAM/shard)
cluster_host_alias: "tensor-upv"
remote_hostname: "tensor.dsic.upv.es"
remote_workspace_dir: "~/continual-sleep-engine"
remote_venv_path: "~/venv/sleep_env"

slurm:
  partition: "docencia"
  logical_shards: 2            # --gres=shard:2 (~16GB VRAM on L40S)
  cpus_per_task: 4
  time_limit: "01:00:00"
  job_name: "continual_sleep"

storage_safety:
  excluded_mounts:
    - "asigDSIC"
    - "W"
  max_home_usage_gb: 15.0
