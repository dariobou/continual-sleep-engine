[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-sleep-engine"
version = "0.2.0"
description = "Edge-to-HPC Asynchronous Memory Consolidation for SLMs with Automated Alignment & Safety Quality Gates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Darío", email = "dario@alumno.upv.es" }
]
keywords = ["llm", "continual-learning", "lora", "ai-safety", "slurm", "gguf", "edge-ai"]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
hpc = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.10.0",
    "datasets>=2.21.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "edge*", "cluster*", "safety_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
